openapi: 3.1.0
info:
  title: KCPL Operations API
  version: 1.4.0
  description: >-
    Read-only access to authorised Kapileshwor Cargo operational data. Use these
    actions for current KCPL shipments, Job Files, customers, quotes, pickup/appointment status,
    freight-document controls, delivery/POD status, Freight Audit/Match-Pay controls and operations briefings.
servers:
  - url: https://kcpl--kcpl-82574.asia-southeast1.hosted.app
security:
  - KcplApiKey: []
paths:
  /api/gpt/health:
    get:
      operationId: checkKcplConnection
      summary: Check the KCPL connection
      description: Verify that the protected KCPL GPT gateway and Firebase runtime are available.
      responses:
        "200":
          description: KCPL gateway status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "401":
          description: Invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/gpt/briefing:
    get:
      operationId: getKcplOperationsBriefing
      summary: Get the KCPL operations briefing
      description: >-
        Return shipment status totals, branch workload and shipments requiring
        attention. Use this for morning briefings, operational overviews and exception checks.
      responses:
        "200":
          description: Current KCPL operations briefing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefingResponse"
        "401":
          description: Invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/gpt/pickups:
    get:
      operationId: getKcplPickupBriefing
      summary: Get the KCPL pickup and appointment briefing
      description: >-
        Return booked shipments awaiting pickup scheduling, requested and confirmed appointment
        windows, driver/vehicle assignment, missed pickups and pickups completed today. This action
        is read-only and cannot schedule, confirm, assign, complete or cancel a pickup.
      responses:
        "200":
          description: Current pickup and appointment briefing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupBriefingResponse"
        "401":
          description: Invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/gpt/freight-documents:
    get:
      operationId: getKcplFreightDocumentBriefing
      summary: Get the KCPL freight-document briefing
      description: >-
        Return generated carriage/execution document status, shipments missing a primary generated
        carriage document and generated documents awaiting review. This action exposes metadata and
        hashes only and cannot generate, download, verify or supersede documents.
      responses:
        "200":
          description: Current freight-document control briefing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreightDocumentBriefingResponse"
        "401":
          description: Invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/gpt/delivery:
    get:
      operationId: getKcplDeliveryBriefing
      summary: Get the KCPL delivery and POD briefing
      description: >-
        Return final-mile workload, failed/refused attempts, delivered shipments waiting for POD,
        verified POD totals and a prioritised delivery attention list. Binary POD files, Firebase
        Storage paths and signed URLs are intentionally excluded.
      responses:
        "200":
          description: Current delivery and POD briefing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryBriefingResponse"
        "401":
          description: Invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/gpt/freight-audit:
    get:
      operationId: getKcplFreightAuditBriefing
      summary: Get KCPL Freight Audit and Match-Pay intelligence
      description: >-
        Return supplier invoice audit status, booked procurement comparisons, variances,
        disputes and bills currently blocked from payment. This action is read-only and cannot
        approve a variance, approve a supplier bill or record a payment.
      parameters:
        - name: q
          in: query
          required: false
          description: >-
            Optional supplier, payable reference, supplier invoice reference, shipment reference,
            branch or audit status to search.
          schema:
            type: string
            maxLength: 180
      responses:
        "200":
          description: Current Freight Audit and Match-Pay briefing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreightAuditBriefingResponse"
        "401":
          description: Invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/gpt/search:
    get:
      operationId: searchKcplOperations
      summary: Search KCPL operations
      description: >-
        Search recent shipments, customers and quotes. Use a shipment reference,
        customer name, route, carrier, branch, status, contact detail or other identifying text.
      parameters:
        - name: q
          in: query
          required: false
          description: Free-text search. Leave blank only when recent records are useful.
          schema:
            type: string
            maxLength: 180
        - name: kind
          in: query
          required: false
          description: Restrict the search to one record type.
          schema:
            type: string
            enum: [all, shipment, customer, quote]
            default: all
        - name: status
          in: query
          required: false
          description: Exact internal shipment or quote status when the user asks for one status.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return.
          schema:
            type: integer
            minimum: 1
            maximum: 40
            default: 15
      responses:
        "200":
          description: Matching KCPL records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "401":
          description: Invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/gpt/jobs/{reference}:
    get:
      operationId: getKcplJobFile
      summary: Get a KCPL Job File
      description: >-
        Retrieve a shipment Job File with route, customer, tasks, customs controls,
        document requirements, document verification state, delivery/POD metadata,
        events and activity. Use this after identifying a shipment reference.
      parameters:
        - name: reference
          in: path
          required: true
          description: Full KCPL shipment reference.
          schema:
            type: string
      responses:
        "200":
          description: Current KCPL Job File.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobFileResponse"
        "401":
          description: Invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Shipment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        service:
          type: string
        firebaseConfigured:
          type: boolean
        mode:
          type: string
      additionalProperties: true
    BriefingResponse:
      type: object
      properties:
        ok:
          type: boolean
        generatedAt:
          type: string
        sampledShipmentCount:
          type: integer
        activeShipmentCount:
          type: integer
        statusCounts:
          type: object
          properties: {}
          additionalProperties:
            type: integer
        activeShipmentsByPrimaryBranch:
          type: object
          properties: {}
          additionalProperties:
            type: integer
        attentionCount:
          type: integer
        attention:
          type: array
          items:
            type: object
            properties: {}
            additionalProperties: true
        note:
          type: string
      additionalProperties: true
    PickupBriefingResponse:
      type: object
      properties:
        ok:
          type: boolean
        generatedAt:
          type: string
        sampledShipmentCount:
          type: integer
        pickupShipmentCount:
          type: integer
        summary:
          type: object
          properties:
            unscheduled:
              type: integer
            requested:
              type: integer
            confirmed:
              type: integer
            driver_assigned:
              type: integer
            missed:
              type: integer
            picked_up_today:
              type: integer
          additionalProperties: false
        attentionCount:
          type: integer
        attention:
          type: array
          items:
            type: object
            properties: {}
            additionalProperties: true
        safety:
          type: string
      additionalProperties: true
    FreightDocumentBriefingResponse:
      type: object
      properties:
        ok:
          type: boolean
        generatedAt:
          type: string
        sampledShipmentCount:
          type: integer
        generatedDocumentCount:
          type: integer
        summary:
          type: object
          properties:
            currentGenerated:
              type: integer
            awaitingReview:
              type: integer
            verified:
              type: integer
            shipmentAttentionCount:
              type: integer
          additionalProperties: false
        attention:
          type: array
          items:
            type: object
            properties: {}
            additionalProperties: true
        safety:
          type: string
      additionalProperties: true
    DeliveryBriefingResponse:
      type: object
      properties:
        ok:
          type: boolean
        generatedAt:
          type: string
        sampledShipmentCount:
          type: integer
        deliveryShipmentCount:
          type: integer
        summary:
          type: object
          properties:
            ready:
              type: integer
            out_for_delivery:
              type: integer
            failed_or_refused:
              type: integer
            delivered_pod_pending:
              type: integer
            pod_verified:
              type: integer
          additionalProperties: false
        attentionCount:
          type: integer
        attention:
          type: array
          items:
            type: object
            properties: {}
            additionalProperties: true
        privacy:
          type: string
      additionalProperties: true
    FreightAuditBriefingResponse:
      type: object
      properties:
        ok:
          type: boolean
        generatedAt:
          type: string
        query:
          type: string
        sampledPayableCount:
          type: integer
        supplierBillCount:
          type: integer
        summary:
          type: object
          properties:
            matched:
              type: integer
            reviewRequired:
              type: integer
            disputed:
              type: integer
            approvedVariance:
              type: integer
            pendingOrStale:
              type: integer
            paymentBlocked:
              type: integer
          additionalProperties: false
        attentionCount:
          type: integer
        attention:
          type: array
          items:
            type: object
            properties: {}
            additionalProperties: true
        matches:
          type: array
          items:
            type: object
            properties: {}
            additionalProperties: true
        safety:
          type: string
      additionalProperties: true
    SearchResponse:
      type: object
      properties:
        ok:
          type: boolean
        query:
          type: string
        kind:
          type: string
        status:
          type: string
        count:
          type: integer
        results:
          type: array
          items:
            type: object
            properties: {}
            additionalProperties: true
      additionalProperties: true
    JobFileResponse:
      type: object
      properties:
        ok:
          type: boolean
        job:
          type: object
          properties: {}
          additionalProperties: true
        route:
          type: object
          properties: {}
          additionalProperties: true
        customer:
          type: object
          properties: {}
          additionalProperties: true
        readiness:
          type: object
          properties: {}
          additionalProperties: true
        delivery:
          type: object
          properties: {}
          additionalProperties: true
        tasks:
          type: array
          items:
            type: object
            properties: {}
            additionalProperties: true
        customsSteps:
          type: array
          items:
            type: object
            properties: {}
            additionalProperties: true
        documentRequirements:
          type: array
          items:
            type: object
            properties: {}
            additionalProperties: true
        documents:
          type: array
          items:
            type: object
            properties: {}
            additionalProperties: true
        events:
          type: array
          items:
            type: object
            properties: {}
            additionalProperties: true
        activity:
          type: array
          items:
            type: object
            properties: {}
            additionalProperties: true
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
        error:
          type: string
      additionalProperties: true
  securitySchemes:
    KcplApiKey:
      type: apiKey
      in: header
      name: x-api-key
