openapi: 3.1.0
info:
  title: KCPL Operations API
  version: 1.6.0
  description: >-
    Read-only access to authorised Kapileshwor Cargo operational data for shipments,
    Job Files, pickups, freight documents, carrier integrations, EDI, delivery/POD,
    Freight Audit, customers, quotes and operations briefings.
servers:
  - url: https://kcpl--kcpl-82574.asia-southeast1.hosted.app
security:
  - KcplApiKey: []
paths:
  /api/gpt/health:
    get:
      operationId: checkKcplConnection
      summary: Check the KCPL connection
      description: Verify that the protected KCPL GPT gateway and Firebase runtime are available.
      responses:
        "200":
          description: KCPL gateway status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "401":
          description: Invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/gpt/briefing:
    get:
      operationId: getKcplOperationsBriefing
      summary: Get the KCPL operations briefing
      description: Return shipment totals, branch workload and shipments requiring attention for current operations briefings.
      responses:
        "200":
          description: Current KCPL operations briefing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "401":
          description: Invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/gpt/pickups:
    get:
      operationId: getKcplPickupBriefing
      summary: Get the KCPL pickup briefing
      description: Return unscheduled, requested, confirmed, assigned, missed and completed pickup activity. This action is read-only.
      responses:
        "200":
          description: Current pickup and appointment briefing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "401":
          description: Invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/gpt/freight-documents:
    get:
      operationId: getKcplFreightDocumentBriefing
      summary: Get the KCPL freight-document briefing
      description: Return generated freight-document status, missing primary carriage documents and documents awaiting review. No private file URLs are exposed.
      responses:
        "200":
          description: Current freight-document briefing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "401":
          description: Invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/gpt/carrier-integrations:
    get:
      operationId: getKcplCarrierIntegrationBriefing
      summary: Get KCPL carrier integration health
      description: Return carrier adapter status, provider health, linked shipments, synchronization errors and unmatched ocean events without exposing credentials or secrets.
      responses:
        "200":
          description: Current carrier integration briefing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "401":
          description: Invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/gpt/edi:
    get:
      operationId: getKcplEdiBriefing
      summary: Get KCPL EDI 204 990 214 health
      description: Return EDI transport status, queued or dispatched 204 tenders, processed 990 responses, processed 214 tracking and quarantined transactions. Raw X12 and secrets are excluded.
      responses:
        "200":
          description: Current KCPL EDI briefing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "401":
          description: Invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/gpt/delivery:
    get:
      operationId: getKcplDeliveryBriefing
      summary: Get the KCPL delivery and POD briefing
      description: Return delivery workload, failed or refused attempts, delivered shipments waiting for POD and verified POD totals without binary files or signed URLs.
      responses:
        "200":
          description: Current delivery and POD briefing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "401":
          description: Invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/gpt/freight-audit:
    get:
      operationId: getKcplFreightAuditBriefing
      summary: Get KCPL Freight Audit intelligence
      description: Return supplier invoice audit status, procurement comparisons, variances, disputes and bills blocked from payment. This action cannot approve or pay bills.
      parameters:
        - name: q
          in: query
          required: false
          description: Optional supplier, payable, invoice, shipment, branch or audit status search.
          schema:
            type: string
            maxLength: 180
      responses:
        "200":
          description: Current Freight Audit briefing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "401":
          description: Invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/gpt/search:
    get:
      operationId: searchKcplOperations
      summary: Search KCPL operations
      description: Search recent KCPL shipments, customers and quotes by reference, customer, route, carrier, branch, status or contact details.
      parameters:
        - name: q
          in: query
          required: false
          description: Free-text search. Leave blank only when recent records are useful.
          schema:
            type: string
            maxLength: 180
        - name: kind
          in: query
          required: false
          description: Restrict the search to one record type.
          schema:
            type: string
            enum: [all, shipment, customer, quote]
            default: all
        - name: status
          in: query
          required: false
          description: Exact internal shipment or quote status when requested.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of results.
          schema:
            type: integer
            minimum: 1
            maximum: 40
            default: 15
      responses:
        "200":
          description: Matching KCPL records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "401":
          description: Invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/gpt/jobs/{reference}:
    get:
      operationId: getKcplJobFile
      summary: Get a KCPL Job File
      description: Retrieve a shipment Job File with route, customer, workflow readiness, delivery/POD, tasks, customs, document controls, events and activity.
      parameters:
        - name: reference
          in: path
          required: true
          description: Full KCPL shipment reference.
          schema:
            type: string
      responses:
        "200":
          description: Current KCPL Job File.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericResponse"
        "401":
          description: Invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Shipment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    GenericResponse:
      type: object
      properties:
        ok:
          type: boolean
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
        error:
          type: string
      additionalProperties: true
  securitySchemes:
    KcplApiKey:
      type: apiKey
      in: header
      name: x-api-key
