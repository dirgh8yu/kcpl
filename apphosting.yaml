# Firebase App Hosting runtime settings for KCPL.
# Project-specific environment variables and secrets belong in the Firebase
# App Hosting backend configuration / Cloud Secret Manager, not in Git.
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  memoryMiB: 512

env:
  # The public canonical origin. Not a secret, and NEXT_PUBLIC_* is inlined at
  # build time, so it needs BUILD availability as well as RUNTIME. A staging
  # backend should override this in its own backend configuration, or it will
  # claim the live canonicals as its own.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://kapileshworcargo.com.np
    availability:
      - BUILD
      - RUNTIME

  # One-tap providers on the customer portal's sign-in, in order: "google",
  # "apple" or "google,apple". Each must also be enabled in Firebase
  # Authentication (Apple needs an Apple Developer Services ID), or its button
  # says it is not switched on yet. Not a secret; inlined at build time.
  - variable: NEXT_PUBLIC_KCPL_SIGN_IN_PROVIDERS
    value: google
    availability:
      - BUILD
      - RUNTIME

  - variable: KCPL_GPT_ACTION_SECRET
    secret: KCPL_GPT_ACTION_SECRET
    availability:
      - RUNTIME
