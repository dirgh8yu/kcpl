name: kcpl_customer
description: "KCPL (customers) and KCPL Ops (staff): the Kapileshwor Cargo apps."
publish_to: 'none'

# build-name becomes versionName / CFBundleShortVersionString, build-number
# versionCode / CFBundleVersion. Override per build with --build-name and
# --build-number.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking and sign-in
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  clock: ^1.1.3

  # Push (Firebase Cloud Messaging)
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

  # Documents, calls and WhatsApp
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  url_launcher: ^6.3.2

  # Display: 90/120Hz on Android screens that offer it
  flutter_displaymode: ^0.7.0

  intl: ^0.20.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/brand/

  # Nepali renders in the same face on every phone and on the web build,
  # rather than whichever Devanagari font a handset happens to carry.
  # SIL Open Font License, see assets/fonts/OFL.txt.
  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600

# Launcher icons for the customer app (KCPL Ops: flutter_launcher_icons-ops.yaml).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/icon-foreground.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#F7F7F8"
    theme_color: "#DC143C"

# The native launch screen: the K on white (black in dark mode), so the app
# opens straight onto the brand and then the animated K takes over.
# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#000000"
  image: assets/splash/splash-k.png
  android_12:
    image: assets/splash/splash-k-android12.png
    color: "#FFFFFF"
    color_dark: "#000000"
  web: false
