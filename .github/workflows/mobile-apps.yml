name: KCPL apps (Android)

# Builds installable Android apps for KCPL (customers) and KCPL Ops (staff)
# whenever the apps change, or on demand from the Actions tab. Download them
# from the run's "Artifacts". They are signed with a debug key: fine to
# install directly on a phone, not for the Play Store (that needs
# android/key.properties and an upload keystore, see mobile/README.md).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   KCPL_FIREBASE_API_KEY  the Firebase Web API key. Without it only the
#                          sample-data (demo) builds are made.
#   GOOGLE_SERVICES_JSON   the full contents of google-services.json for
#                          both Android apps. Without it the apps build and
#                          work, but push notifications stay off.

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      KCPL_FIREBASE_API_KEY: ${{ secrets.KCPL_FIREBASE_API_KEY }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      # Written for the build only; it is git-ignored and never committed.
      - name: Firebase config for push
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Build
        run: |
          mkdir -p ../apks
          build() { # flavor, entry point, output name, define
            flutter build apk --release --flavor "$1" -t "$2" "$4"
            cp "build/app/outputs/flutter-apk/app-$1-release.apk" "../apks/$3.apk"
          }
          if [ -n "$KCPL_FIREBASE_API_KEY" ]; then
            build customer lib/main.dart     KCPL     "--dart-define=KCPL_FIREBASE_API_KEY=$KCPL_FIREBASE_API_KEY"
            build ops      lib/ops/main.dart KCPL-Ops "--dart-define=KCPL_FIREBASE_API_KEY=$KCPL_FIREBASE_API_KEY"
          else
            echo "::warning::KCPL_FIREBASE_API_KEY is not set: building the demo apps only."
          fi
          # Sample-data builds for showing the apps without an account. They
          # share the package names above, so installing one replaces the other.
          build customer lib/main.dart     KCPL-demo     "--dart-define=KCPL_DEMO=true"
          build ops      lib/ops/main.dart KCPL-Ops-demo "--dart-define=KCPL_DEMO=true"
          ls -la ../apks

      - uses: actions/upload-artifact@v4
        with:
          name: kcpl-android-apps
          path: apks/*.apk
          retention-days: 30
