name: KCPL CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/enquiries-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Apply exact Enquiries TypeScript repair
        if: github.actor != 'github-actions[bot]'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/admin/admin-dashboard.tsx')
          text = path.read_text()
          old = 'return modeLabels[mode.toLowerCase()] ?? mode || "Freight";'
          new = 'return (modeLabels[mode.toLowerCase()] ?? mode) || "Freight";'
          if old not in text:
              raise SystemExit('Expected modeLabel expression was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/admin-dashboard.tsx
          git commit -m "Fix Enquiries mode label fallback"
          git push origin HEAD:audit/enquiries-v1

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm test