name: KCPL CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/customers-v1
          fetch-depth: 0

      - name: Apply Customer dashboard permission contract
        if: github.actor != 'github-actions[bot]'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('app/admin/crm/crm-dashboard.tsx')
          text = path.read_text()
          replacements = [
            ('export function CrmDashboard({ initialCustomers, initialStats, userName, userEmail }: { initialCustomers: CrmCustomerSummary[]; initialStats: CrmDashboardStats; userName: string; userEmail: string }) {', 'export function CrmDashboard({ initialCustomers, initialStats, userName, userEmail, commercialVisible }: { initialCustomers: CrmCustomerSummary[]; initialStats: CrmDashboardStats; userName: string; userEmail: string; commercialVisible: boolean }) {'),
            (': selected ? <CustomerOverview customer={selected} onNew={openNew}/>', ': selected ? <CustomerOverview customer={selected} onNew={openNew} commercialVisible={commercialVisible}/>'),
            ('function CustomerOverview({ customer, onNew }: { customer: CrmCustomerSummary; onNew: () => void }) {', 'function CustomerOverview({ customer, onNew, commercialVisible }: { customer: CrmCustomerSummary; onNew: () => void; commercialVisible: boolean }) {'),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Customer dashboard contract block not found: {old[:70]}')
            text = text.replace(old, new, 1)
          pattern = r'(<OpsSurface eyebrow="Commercial" title=\{`\$\{customer\.preferred_currency\} account`\}.*?</OpsSurface>)'
          text, count = re.subn(pattern, r'{commercialVisible ? \1 : null}', text, count=1, flags=re.S)
          if count != 1:
            raise SystemExit('Customer commercial surface not found')
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/crm/crm-dashboard.tsx
          git commit -m "Respect commercial visibility in Customers"
          git push origin HEAD:audit/customers-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Regression tests
        run: npm test

      - name: Production build
        run: npm run build
