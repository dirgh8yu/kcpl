name: KCPL CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: polish/operations-v3-1-work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: npm install

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for Next.js 16.2.11"
          git push origin HEAD:polish/operations-v3-1-work

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm test
