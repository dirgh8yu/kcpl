name: KCPL CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: redesign/operations-os-v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Apply targeted workspace refinements
        if: github.actor != 'github-actions[bot]'
        run: node scripts/apply-operations-v4-targeted.cjs

      - name: Commit targeted workspace refinements
        if: github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/admin/admin-dashboard.tsx app/admin/shipments/shipments-workspace.tsx app/admin/alerts/alerts-workspace.tsx app/admin/crm/crm-dashboard.tsx app/admin/partners/partners-workspace.tsx app/admin/finance/finance-workspace.tsx
            git commit -m "Refine core KCPL operational workspaces"
            git push origin HEAD:redesign/operations-os-v4
          fi

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm test
