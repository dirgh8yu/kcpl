name: KCPL CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/shipments-alerts-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Apply exact shipment access repairs
        if: github.actor != 'github-actions[bot]'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/admin/workflow-guard.server.ts')
          text = path.read_text()
          old = '''function branchValue(value: unknown, fallback: KcplBranch = "Kathmandu"): KcplBranch {
            return kcplBranches.includes(value as KcplBranch) ? value as KcplBranch : fallback;
          }'''.replace('          ', '')
          new = '''function branchValue(value: unknown): KcplBranch | null {
            return kcplBranches.includes(value as KcplBranch) ? value as KcplBranch : null;
          }

          function branchArray(value: unknown): KcplBranch[] {
            if (!Array.isArray(value)) return [];
            return [...new Set(value.filter((item): item is KcplBranch => kcplBranches.includes(item as KcplBranch)))];
          }'''.replace('          ', '')
          if old not in text:
              raise SystemExit('workflow branchValue block not found')
          text = text.replace(old, new, 1)
          old = '''  const customerId = nullable(data.customer_id);
  const customer = customerId ? await db.collection("customers").doc(customerId).get() : null;
  const branch = branchValue(data.primary_branch, branchValue(customer?.get("primary_branch")));
  if (context && !staffCanAccessBranch(context, branch)) return { kind: "forbidden" as const };
  const quoteReference = nullable(data.quote_reference);'''
          new = '''  const customerId = nullable(data.customer_id);
  const customer = customerId ? await db.collection("customers").doc(customerId).get() : null;
  const primary = branchValue(data.primary_branch) ?? branchValue(customer?.get("primary_branch"));
  const handling = branchArray(data.handling_branches);
  const accessBranches = [...new Set([...(primary ? [primary] : []), ...handling])];
  if (context && !context.can_access_all_branches && !accessBranches.some((branch) => staffCanAccessBranch(context, branch))) {
    return { kind: "forbidden" as const };
  }
  const branch = primary ?? handling[0] ?? "Kathmandu";
  const quoteReference = nullable(data.quote_reference);'''
          if old not in text:
              raise SystemExit('workflow load branch block not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('app/admin/command-centre/command-centre.server.ts')
          text = path.read_text()
          old = '''function branchValue(value: unknown): KcplBranch {
  return kcplBranches.includes(value as KcplBranch) ? value as KcplBranch : "Kathmandu";
}

function branchArray(value: unknown, primary: KcplBranch): KcplBranch[] {
  const branches = Array.isArray(value)
    ? value.filter((item): item is KcplBranch => kcplBranches.includes(item as KcplBranch))
    : [];
  if (!branches.includes(primary)) branches.unshift(primary);
  return branches;
}'''
          new = '''function branchValue(value: unknown): KcplBranch | null {
  return kcplBranches.includes(value as KcplBranch) ? value as KcplBranch : null;
}

function branchArray(value: unknown): KcplBranch[] {
  if (!Array.isArray(value)) return [];
  return [...new Set(value.filter((item): item is KcplBranch => kcplBranches.includes(item as KcplBranch)))];
}'''
          if old not in text:
              raise SystemExit('command centre branch helpers not found')
          text = text.replace(old, new, 1)
          old = '''    const primary = branchValue(data.primary_branch);
    const handling = branchArray(data.handling_branches, primary);
    const allowed = staffCanAccessBranch(context, primary) || handling.some((branch) => staffCanAccessBranch(context, branch));
    return allowed ? [{ id: doc.id, data, status, primary, handling }] : [];'''
          new = '''    const primaryValue = branchValue(data.primary_branch);
    const handlingValue = branchArray(data.handling_branches);
    const accessBranches = [...new Set([...(primaryValue ? [primaryValue] : []), ...handlingValue])];
    const allowed = context.can_access_all_branches || accessBranches.some((branch) => staffCanAccessBranch(context, branch));
    if (!allowed) return [];
    const primary = primaryValue ?? handlingValue[0] ?? "Kathmandu";
    const handling = [...handlingValue];
    if (!handling.includes(primary)) handling.unshift(primary);
    return [{ id: doc.id, data, status, primary, handling }];'''
          if old not in text:
              raise SystemExit('command centre access block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/workflow-guard.server.ts app/admin/command-centre/command-centre.server.ts
          git commit -m "Align shipment access across handling branches"
          git push origin HEAD:audit/shipments-alerts-v1

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm test
