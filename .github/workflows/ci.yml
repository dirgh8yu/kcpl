name: KCPL CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply Document Vault integration
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          shell = Path('app/admin/operations-shell.tsx')
          text = shell.read_text()
          old = '  Database,\n  HandCoins,'
          new = '  Database,\n  FileText,\n  HandCoins,'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('operations-shell icon anchor not found')
          old = '  { href: "/admin/customs", label: "Customs", icon: ShieldCheck, match: (path) => path.startsWith("/admin/customs"), hint: "Clearance queue, documents and customs blockers" },\n  { href: "/admin/alerts", label: "Tasks & alerts", icon: Bell, match: (path) => path.startsWith("/admin/alerts"), hint: "Exceptions, ownership and follow-up" },'
          new = '  { href: "/admin/customs", label: "Customs", icon: ShieldCheck, match: (path) => path.startsWith("/admin/customs"), hint: "Clearance queue, documents and customs blockers" },\n  { href: "/admin/documents", label: "Documents", icon: FileText, match: (path) => path.startsWith("/admin/documents"), hint: "Verified shipment documents and review queue" },\n  { href: "/admin/alerts", label: "Tasks & alerts", icon: Bell, match: (path) => path.startsWith("/admin/alerts"), hint: "Exceptions, ownership and follow-up" },'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('operations-shell nav anchor not found')
          shell.write_text(text)

          job = Path('app/admin/jobs/[reference]/job-file-workspace.tsx')
          text = job.read_text()
          old = '      setNotice(`${data.document.filename} uploaded.`);'
          new = '      setNotice(`${data.document.filename} uploaded. Review is required before it counts toward controlled readiness.`);'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('upload notice anchor not found')

          old = '<OpsSurface eyebrow="Document vault" title="Shipment documents" description="Private Firebase Storage files attached to this movement." action={<span className="text-[9px] font-semibold text-[#938981]">{documents.length} files</span>}>'
          new = '<OpsSurface eyebrow="Document vault" title="Shipment documents" description="Files are Received on upload. Only verified, unexpired evidence satisfies controlled readiness." action={<Link href="/admin/documents" className="ops-button" data-variant="ghost" data-size="sm">Open Document Vault</Link>}>'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Job File Document Vault surface anchor not found')

          old = 'documents.map((document) => <DocumentRow key={document.id} document={document} jobReference={job.reference} documentBusy={documentBusy} onDelete={() => deleteDocument(document)}/>)'
          new = 'documents.map((document) => <DocumentRow key={document.id} document={document} jobReference={job.reference} documentBusy={documentBusy} role={role} currentUserEmail={currentUserEmail} onDelete={() => deleteDocument(document)}/>)'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('DocumentRow call anchor not found')

          old = '''function DocumentRow({ document, jobReference, documentBusy, onDelete }: { document: ShipmentDocument; jobReference: string; documentBusy: boolean; onDelete: () => void }) {
  return <div className="flex items-start gap-3 py-3"><span className="grid h-8 w-8 shrink-0 place-items-center rounded-[10px] bg-[#f4eee9] text-[#9b745f]"><FileText size={14}/></span><div className="min-w-0 flex-1"><p className="truncate text-[10px] font-bold text-[#514840]">{document.filename}</p><p className="mt-1 text-[8px] text-[#9b9189]">{shipmentDocumentTypeLabels[document.document_type]} · {bytes(document.size_bytes)} · {dateTime(document.uploaded_at)}</p><div className="mt-2 flex flex-wrap gap-1.5"><a href={`/api/admin/shipments/${encodeURIComponent(jobReference)}/documents/${document.id}`} className="ops-button" data-variant="ghost" data-size="sm"><Download size={10}/>Download</a><button type="button" disabled={documentBusy} onClick={onDelete} className="ops-button" data-variant="danger" data-size="sm"><Trash2 size={10}/>Delete</button></div></div></div>;
}'''
          new = '''function DocumentRow({ document, jobReference, documentBusy, role, currentUserEmail, onDelete }: { document: ShipmentDocument; jobReference: string; documentBusy: boolean; role: KcplStaffRole; currentUserEmail: string; onDelete: () => void }) {
  const status = document.review_status ?? "received";
  const formatter = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Kathmandu", year: "numeric", month: "2-digit", day: "2-digit" });
  const parts = Object.fromEntries(formatter.formatToParts(new Date()).map((part) => [part.type, part.value]));
  const today = `${parts.year}-${parts.month}-${parts.day}`;
  const expired = status === "verified" && Boolean(document.expires_on && document.expires_on < today);
  const controlLabel = expired ? "Expired" : status.replaceAll("_", " ").replace(/^./, (value) => value.toUpperCase());
  const controlTone: "neutral" | "warning" | "success" | "danger" = expired || status === "rejected" ? "danger" : status === "verified" ? "success" : status === "received" || status === "under_review" ? "warning" : "neutral";
  const canDelete = role === "management" || (role === "operations" && status === "received" && currentUserEmail.trim().toLowerCase() === (document.uploaded_by_email ?? "").trim().toLowerCase());
  return <div className="flex items-start gap-3 py-3"><span className="grid h-8 w-8 shrink-0 place-items-center rounded-[10px] bg-[#f4eee9] text-[#9b745f]"><FileText size={14}/></span><div className="min-w-0 flex-1"><div className="flex flex-wrap items-center gap-1.5"><p className="min-w-0 truncate text-[10px] font-bold text-[#514840]">{document.filename}</p><OpsBadge tone={controlTone}>{controlLabel}</OpsBadge></div><p className="mt-1 text-[8px] text-[#9b9189]">{shipmentDocumentTypeLabels[document.document_type]} · {bytes(document.size_bytes)} · {dateTime(document.uploaded_at)}{document.expires_on ? ` · expires ${dateLabel(document.expires_on)}` : ""}</p><div className="mt-2 flex flex-wrap gap-1.5"><a href={`/api/admin/shipments/${encodeURIComponent(jobReference)}/documents/${document.id}`} className="ops-button" data-variant="ghost" data-size="sm"><Download size={10}/>Download</a><Link href="/admin/documents" className="ops-button" data-variant="secondary" data-size="sm">Review in Vault</Link>{canDelete ? <button type="button" disabled={documentBusy} onClick={onDelete} className="ops-button" data-variant="danger" data-size="sm"><Trash2 size={10}/>Delete</button> : null}</div></div></div>;
}'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('DocumentRow definition anchor not found')
          job.write_text(text)
          PY

          if ! git diff --quiet; then
            git config user.name "KCPL CI"
            git config user.email "automation@kcpl.internal"
            git add app/admin/operations-shell.tsx 'app/admin/jobs/[reference]/job-file-workspace.tsx'
            git commit -m "Integrate Document Vault into operations UI"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Regression tests
        run: npm test

      - name: Production build
        run: npm run build
