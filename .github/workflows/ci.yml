name: KCPL CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency advisory report
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: UI consistency contract
        env:
          KCPL_UI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:ui

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Workflow and policy tests
        shell: bash
        # `tee` must not swallow the suite's exit code; the artifact is uploaded
        # by the next step either way, but a red suite has to fail this job.
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcpl-test-output
          path: test-output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Production build
        run: npm run build
