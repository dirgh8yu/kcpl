name: KCPL CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit/customers-v1
          fetch-depth: 0

      - name: Apply Part 3A customer core patch
        if: github.actor != 'github-actions[bot]'
        run: |
          awk '/python - <<'\''PY'\''/{flag=1;next}/^          PY$/{flag=0}flag{sub(/^          /,""); print}' .github/workflows/part3a-core-apply.yml > /tmp/part3a_apply.py
          python /tmp/part3a_apply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests
          git commit -m "Harden customer RBAC and CRM data truth"
          git push origin HEAD:audit/customers-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Regression tests
        run: npm test

      - name: Production build
        run: npm run build
