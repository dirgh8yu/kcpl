name: Remove Home network panel

on:
  push:
    branches: [ui/remove-home-network]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/remove-home-network
          fetch-depth: 0

      - name: Remove map from Home
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/admin/command-centre/command-centre-workspace.tsx')
          text = path.read_text()
          text = text.replace('import { NepalOperationsMap } from "../../components/operations-map";\n', '')
          text = text.replace('  network: true,\n', '')
          text = text.replace(' : key === "network" ? "Network map"', '')
          block = '''        {sections.network ? <HomePanel title="KCPL operating network" eyebrow="Branches & movement" action={<span className="text-[10px] font-medium text-[#766f68]">Recorded operational location, not GPS tracking</span>}>\n          <NepalOperationsMap variant="home" locationLinkHref="/network#confirmed-locations"/>\n        </HomePanel> : null}\n\n'''
          if block not in text:
              raise SystemExit('Home network block not found')
          text = text.replace(block, '', 1)
          path.write_text(text)

          path = Path('app/admin/command-centre/role-home-defaults.tsx')
          text = path.read_text()
          text = text.replace('  network: boolean;\n', '')
          text = text.replace(', network: true', '')
          text = text.replace(', network: false', '')
          path.write_text(text)
          PY

          git rm .github/workflows/remove-home-network.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/command-centre/command-centre-workspace.tsx app/admin/command-centre/role-home-defaults.tsx
          git commit -m "Remove operating network map from Home"
          git push origin HEAD:ui/remove-home-network
