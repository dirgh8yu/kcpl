name: Part 3A customer core apply

on:
  push:
    branches: [audit/customers-v1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/customers-v1
          fetch-depth: 0
      - name: Apply customer core hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def text(path):
              return Path(path).read_text()

          def write(path, value):
              Path(path).write_text(value)

          def replace(path, old, new, count=1):
              value = text(path)
              if value.count(old) < count:
                  raise SystemExit(f"Expected block not found in {path}: {old[:100]!r}")
              write(path, value.replace(old, new, count))

          # CRM data: branch-scoped listing, larger operational register, Finance-owned outstanding balance.
          path = 'app/admin/crm/crm-data.server.ts'
          replace(path,
              'import { firebaseAdminDb, firebaseRuntimeConfigured } from "../../firebase-admin.server";\n',
              'import { firebaseAdminDb, firebaseRuntimeConfigured } from "../../firebase-admin.server";\nimport { staffCanAccessBranch, type KcplStaffContext } from "../staff-directory.server";\n')
          replace(path, '''export async function listCrmCustomers(): Promise<CrmCustomerSummary[] | null> {
  if (!firebaseRuntimeConfigured()) return null;
  const snapshot = await firebaseAdminDb().collection("customers")
    .orderBy("updated_at", "desc")
    .limit(500)
    .get();
  return snapshot.docs
    .map((doc) => summaryFromData(doc.id, doc.data() as Record<string, unknown>))
    .filter((customer) => !customer.archived);
}''', '''export async function listCrmCustomers(context?: KcplStaffContext): Promise<CrmCustomerSummary[] | null> {
  if (!firebaseRuntimeConfigured()) return null;
  const snapshot = await firebaseAdminDb().collection("customers")
    .orderBy("updated_at", "desc")
    .limit(2000)
    .get();
  return snapshot.docs.flatMap((doc) => {
    const data = doc.data() as Record<string, unknown>;
    if (booleanValue(data.archived)) return [];
    const rawBranch = kcplBranches.includes(data.primary_branch as KcplBranch) ? data.primary_branch as KcplBranch : null;
    if (context && !context.can_access_all_branches && (!rawBranch || !staffCanAccessBranch(context, rawBranch))) return [];
    return [summaryFromData(doc.id, data)];
  });
}''')
          replace(path, '    outstanding_balance: parseOptionalMoney(input.outstandingBalance),', '    outstanding_balance: 0,')

          # Customer management: outstanding balance is derived from Receivables only.
          path = 'app/admin/crm/crm-customer-management.server.ts'
          replace(path, '  outstandingBalance?: number | null;\n', '')
          replace(path, '      if (input.outstandingBalance !== undefined) update.outstanding_balance = input.outstandingBalance;\n', '')

          # Customer index: branch-scoped data and server-side commercial redaction.
          path = 'app/admin/crm/page.tsx'
          replace(path, '    customers = await listCrmCustomers();', '    customers = await listCrmCustomers(staff);')
          replace(path, '''  return (
    <OperationsShell''', '''  const safeCustomers = staff.permissions.canViewCommercial
    ? customers
    : customers.map((customer) => ({ ...customer, revenue_total: 0, cost_total: 0, profit_total: 0 }));

  return (
    <OperationsShell''')
          replace(path, '      <CrmCustomerJump customers={customers} />\n      <CrmDashboard initialCustomers={customers} initialStats={crmDashboardStats(customers)} userName={access.user.displayName} userEmail={access.user.email} />', '      <CrmCustomerJump customers={safeCustomers} />\n      <CrmDashboard initialCustomers={safeCustomers} initialStats={crmDashboardStats(safeCustomers)} userName={access.user.displayName} userEmail={access.user.email} commercialVisible={staff.permissions.canViewCommercial} />')

          # Customer 360: Firestore staff profile is authoritative and branch gate runs before data fan-out.
          path = 'app/admin/crm/[id]/page.tsx'
          replace(path, 'import { staffCapabilitiesForEmail, type StaffCapabilities } from "../../staff-permissions";', 'import type { StaffCapabilities } from "../../staff-permissions";')
          replace(path, 'import { OperationsShell } from "../../operations-shell";\n', 'import { OperationsShell } from "../../operations-shell";\nimport { checkCrmCustomerAccess } from "../crm-access.server";\n')
          replace(path, '  const permissions = staffCapabilitiesForEmail(access.user.email);\n  const { id } = await params;', '  const permissions = staff.permissions;\n  const { id } = await params;\n  const customerAccess = await checkCrmCustomerAccess(id, staff);\n  if (customerAccess.kind === "unavailable") return <CustomerGate title="Firestore is unavailable" detail="The CRM backend is not available for this deployment."/>;\n  if (customerAccess.kind === "missing") return <CustomerGate title="Customer not found" detail="This CRM record does not exist or has been archived."/>;\n  if (customerAccess.kind === "forbidden") return <CustomerGate title="Customer access restricted" detail="This customer belongs to a KCPL branch outside your assigned access."/>;')

          # Quote-created customers inherit an authorised branch rather than always becoming Kathmandu records.
          path = 'app/admin/crm/crm-quote-links.server.ts'
          replace(path, 'import { crmCurrencies, type CrmCurrency } from "./crm-data";', 'import { crmCurrencies, type CrmCurrency, type KcplBranch } from "./crm-data";')
          replace(path, 'export async function createCrmCustomerFromQuote(quoteReference: string, actor: Actor) {', 'export async function createCrmCustomerFromQuote(quoteReference: string, actor: Actor, primaryBranch: KcplBranch = "Kathmandu") {')
          replace(path, '    primaryBranch: "Kathmandu",', '    primaryBranch,')

          path = 'app/api/admin/quotes/[reference]/route.ts'
          replace(path, '      const result = await createCrmCustomerFromQuote(reference, { name: auth.user.displayName, email: auth.user.email });', '      const customerBranch = auth.staff.can_access_all_branches ? "Kathmandu" : auth.staff.branches[0];\n      if (!customerBranch) return json({ ok: false, error: "Your staff profile has no KCPL branch available for this customer." }, 403);\n      const result = await createCrmCustomerFromQuote(reference, { name: auth.user.displayName, email: auth.user.email }, customerBranch);')

          # Detail API: branch access, buyer identity, branch moves, credit holds/blacklisting, derived AR.
          path = 'app/api/admin/crm/customers/[id]/route.ts'
          replace(path, 'import { getCrmCustomer } from "../../../../../admin/crm/crm-data.server";\n', 'import { getCrmCustomer } from "../../../../../admin/crm/crm-data.server";\nimport { checkCrmCustomerAccess, staffCanUseCrmBranch } from "../../../../../admin/crm/crm-access.server";\nimport { crmAccountStatusChangeError, hasCustomerRelationship } from "../../../../../admin/crm/crm-policy";\n')
          replace(path, '''  const { id } = await context.params;
  try {
    const customer = await getCrmCustomer(id);''', '''  const { id } = await context.params;
  const access = await checkCrmCustomerAccess(id, auth.staff);
  if (access.kind === "unavailable") return crmJson({ ok: false, error: "CRM storage is unavailable." }, 503);
  if (access.kind === "missing") return crmJson({ ok: false, error: "Customer record not found." }, 404);
  if (access.kind === "forbidden") return crmJson({ ok: false, error: "This customer is outside your KCPL branch access." }, 403);
  try {
    const customer = await getCrmCustomer(id);''', 1)
          # PATCH access block after capability check.
          marker = '''  const capabilityError = requireCrmCapability(auth.permissions, "canEditCustomer");
  if (capabilityError) return capabilityError;

  let body: Record<string, unknown>;'''
          repl = '''  const capabilityError = requireCrmCapability(auth.permissions, "canEditCustomer");
  if (capabilityError) return capabilityError;
  const { id } = await context.params;
  const access = await checkCrmCustomerAccess(id, auth.staff);
  if (access.kind === "unavailable") return crmJson({ ok: false, error: "CRM storage is unavailable." }, 503);
  if (access.kind === "missing") return crmJson({ ok: false, error: "Customer record not found." }, 404);
  if (access.kind === "forbidden") return crmJson({ ok: false, error: "This customer is outside your KCPL branch access." }, 403);

  let body: Record<string, unknown>;'''
          replace(path, marker, repl, 1)
          replace(path, '  if (!relationshipTypes.length) return crmJson({ ok: false, error: "Choose at least one relationship type." }, 400);', '  if (!hasCustomerRelationship(relationshipTypes)) return crmJson({ ok: false, error: "Customer records must keep the Customer relationship. Suppliers, carriers, agents and vendors belong in Partners." }, 400);')
          replace(path, '  if (!kcplBranches.includes(primaryBranch as KcplBranch)) return crmJson({ ok: false, error: "Choose a valid KCPL branch." }, 400);', '  if (!kcplBranches.includes(primaryBranch as KcplBranch)) return crmJson({ ok: false, error: "Choose a valid KCPL branch." }, 400);\n  if (!staffCanUseCrmBranch(auth.staff, primaryBranch)) return crmJson({ ok: false, error: "You cannot move this customer to a branch outside your KCPL access." }, 403);\n  const currentStatus = crmAccountStatuses.includes(access.snapshot.get("account_status") as CrmAccountStatus) ? access.snapshot.get("account_status") as CrmAccountStatus : "prospect";\n  const statusError = crmAccountStatusChangeError(currentStatus, accountStatus as CrmAccountStatus, auth.permissions);\n  if (statusError) return crmJson({ ok: false, error: statusError }, 403);')
          replace(path, '  const includesCredit = ["paymentTermsDays", "creditLimit", "outstandingBalance"].some((key) => key in body);', '  if (cleanCrmText(body.outstandingBalance)) return crmJson({ ok: false, error: "Outstanding balance is calculated from Receivables and cannot be edited in CRM." }, 400);\n  const includesCredit = ["paymentTermsDays", "creditLimit"].some((key) => key in body);')
          replace(path, '    const outstanding = optionalNumber(body.outstandingBalance);\n    if (paymentTerms.error || credit.error || outstanding.error) return crmJson({ ok: false, error: paymentTerms.error || credit.error || outstanding.error }, 400);\n    paymentTermsDays = paymentTerms.value;\n    creditLimit = credit.value;\n    outstandingBalance = outstanding.value;', '    if (paymentTerms.error || credit.error) return crmJson({ ok: false, error: paymentTerms.error || credit.error }, 400);\n    paymentTermsDays = paymentTerms.value;\n    creditLimit = credit.value;')
          replace(path, '  let outstandingBalance: number | null | undefined;\n', '')
          replace(path, '      ...(includesCredit ? { paymentTermsDays, creditLimit, outstandingBalance } : {}),', '      ...(includesCredit ? { paymentTermsDays, creditLimit } : {}),')
          # Remove the later duplicate params declaration in PATCH only.
          value = text(path)
          first = value.find('  const { id } = await context.params;', value.find('export async function PATCH'))
          second = value.find('  const { id } = await context.params;', first + 1)
          if second == -1:
              raise SystemExit('PATCH duplicate id declaration not found')
          value = value[:second] + value[second:].replace('  const { id } = await context.params;\n', '', 1)
          write(path, value)
          # DELETE access before archive.
          marker = '''  const capabilityError = requireCrmCapability(auth.permissions, "canArchiveCustomer");
  if (capabilityError) return capabilityError;

  const { id } = await context.params;
  try {'''
          repl = '''  const capabilityError = requireCrmCapability(auth.permissions, "canArchiveCustomer");
  if (capabilityError) return capabilityError;

  const { id } = await context.params;
  const access = await checkCrmCustomerAccess(id, auth.staff);
  if (access.kind === "unavailable") return crmJson({ ok: false, error: "CRM storage is unavailable." }, 503);
  if (access.kind === "missing") return crmJson({ ok: false, error: "Customer record not found." }, 404);
  if (access.kind === "forbidden") return crmJson({ ok: false, error: "This customer is outside your KCPL branch access." }, 403);
  try {'''
          replace(path, marker, repl)

          # Child resource routes: explicit customer-edit capability + branch access.
          child_paths = [
            'app/api/admin/crm/customers/[id]/contacts/route.ts',
            'app/api/admin/crm/customers/[id]/addresses/route.ts',
            'app/api/admin/crm/customers/[id]/notes/route.ts',
            'app/api/admin/crm/customers/[id]/tasks/route.ts',
          ]
          for path in child_paths:
              value = text(path)
              value = value.replace('authorizeCrm, cleanCrmText, crmJson, protectCrmWrite, validEmail', 'authorizeCrm, cleanCrmText, crmJson, protectCrmWrite, requireCrmCapability, requireCrmCustomerAccess, validEmail')
              value = value.replace('authorizeCrm, cleanCrmText, crmJson, protectCrmWrite }', 'authorizeCrm, cleanCrmText, crmJson, protectCrmWrite, requireCrmCapability, requireCrmCustomerAccess }')
              # Every handler already resolves id before the server call; insert access immediately after first matching const.
              value = value.replace('  const blocked = protectCrmWrite(request);\n  if (blocked) return blocked;\n', '  const blocked = protectCrmWrite(request);\n  if (blocked) return blocked;\n  const capabilityError = requireCrmCapability(auth.permissions, "canEditCustomer");\n  if (capabilityError) return capabilityError;\n', 1)
              # Tasks has two handlers, patch second capability as well.
              if path.endswith('/tasks/route.ts'):
                  idx = value.find('export async function PATCH')
                  before, after = value[:idx], value[idx:]
                  after = after.replace('  const blocked = protectCrmWrite(request);\n  if (blocked) return blocked;\n', '  const blocked = protectCrmWrite(request);\n  if (blocked) return blocked;\n  const capabilityError = requireCrmCapability(auth.permissions, "canEditCustomer");\n  if (capabilityError) return capabilityError;\n', 1)
                  value = before + after
              # Insert branch gate after each id declaration.
              value = value.replace('  const { id } = await context.params;\n  try {', '  const { id } = await context.params;\n  const accessError = await requireCrmCustomerAccess(id, auth.staff);\n  if (accessError) return accessError;\n  try {')
              write(path, value)

          # Customer follow-ups: normalize datetime-local as Nepal time.
          path = 'app/api/admin/crm/customers/[id]/tasks/route.ts'
          replace(path, 'import { addCrmTask, setCrmTaskCompleted } from "../../../../../../admin/crm/crm-data.server";\n', 'import { addCrmTask, setCrmTaskCompleted } from "../../../../../../admin/crm/crm-data.server";\nimport { normalizeNepalDateTimeInput } from "../../../../../../admin/crm/crm-policy";\n')
          replace(path, '  const dueAt = cleanCrmText(body.dueAt, 40);', '  const dueInput = cleanCrmText(body.dueAt, 40);\n  const dueAt = normalizeNepalDateTimeInput(dueInput);')
          replace(path, '  if (dueAt && Number.isNaN(new Date(dueAt).getTime())) return crmJson({ ok: false, error: "Choose a valid due date/time." }, 400);', '  if (dueAt === null) return crmJson({ ok: false, error: "Choose a valid due date/time." }, 400);')

          # Quote links are customer-scoped resources.
          path = 'app/api/admin/crm/customers/[id]/quote-links/route.ts'
          replace(path, 'authorizeCrm, cleanCrmText, crmJson, protectCrmWrite, requireCrmCapability', 'authorizeCrm, cleanCrmText, crmJson, protectCrmWrite, requireCrmCapability, requireCrmCustomerAccess')
          replace(path, '  const { id } = await context.params;\n\n  try {', '  const { id } = await context.params;\n  const accessError = await requireCrmCustomerAccess(id, auth.staff);\n  if (accessError) return accessError;\n\n  try {', 1)
          # POST id occurs later, insert before try.
          value = text(path)
          idx = value.find('export async function POST')
          before, after = value[:idx], value[idx:]
          after = after.replace('  const { id } = await context.params;\n  try {', '  const { id } = await context.params;\n  const accessError = await requireCrmCustomerAccess(id, auth.staff);\n  if (accessError) return accessError;\n  try {', 1)
          write(path, before + after)

          # Documents: capability plus customer branch scope before metadata/object access.
          path = 'app/api/admin/crm/customers/[id]/documents/route.ts'
          replace(path, 'authorizeCrm, crmJson, protectCrmWrite, requireCrmCapability', 'authorizeCrm, crmJson, protectCrmWrite, requireCrmCapability, requireCrmCustomerAccess')
          value = text(path)
          value = value.replace('  const { id } = await context.params;\n  try {', '  const { id } = await context.params;\n  const accessError = await requireCrmCustomerAccess(id, auth.staff);\n  if (accessError) return accessError;\n  try {')
          write(path, value)

          path = 'app/api/admin/crm/customers/[id]/documents/[documentId]/route.ts'
          replace(path, 'authorizeCrm, crmJson, protectCrmWrite, requireCrmCapability', 'authorizeCrm, crmJson, protectCrmWrite, requireCrmCapability, requireCrmCustomerAccess')
          value = text(path)
          value = value.replace('  const { id, documentId: rawId } = await context.params;\n', '  const { id, documentId: rawId } = await context.params;\n  const accessError = await requireCrmCustomerAccess(id, auth.staff);\n  if (accessError) return accessError;\n')
          write(path, value)

          # Rate cards: real calendar dates, truthful zero-rate validation, branch scope.
          for path in [
            'app/api/admin/crm/customers/[id]/rate-cards/route.ts',
            'app/api/admin/crm/customers/[id]/rate-cards/[rateId]/route.ts',
          ]:
              value = text(path)
              policy_import = '../../../../../../admin/crm/crm-policy' if '/[rateId]/' not in path else '../../../../../../../admin/crm/crm-policy'
              rate_import = 'import { validCalendarDate } from "' + policy_import + '";\n'
              anchor = 'import { '
              # Add policy import after rate-card server import.
              server_line = re.search(r'import \{[^\n]+\} from "[^\n]+crm-rate-cards\.server";\n', value)
              if not server_line:
                  raise SystemExit(f'rate server import not found {path}')
              value = value[:server_line.end()] + rate_import + value[server_line.end():]
              value = value.replace('Rates must be positive numbers.', 'Rates must be zero or greater.')
              value = value.replace('if (value && !/^\\d{4}-\\d{2}-\\d{2}$/.test(value)) return { error: "Rate validity dates must be valid dates." };', 'if (value && !validCalendarDate(value)) return { error: "Rate validity dates must be real calendar dates." };')
              value = value.replace('authorizeCrm, cleanCrmText, crmJson, protectCrmWrite, requireCrmCapability', 'authorizeCrm, cleanCrmText, crmJson, protectCrmWrite, requireCrmCapability, requireCrmCustomerAccess')
              # Resolve params earlier, then gate before reading/writing rate-card children.
              if '/[rateId]/' not in path:
                  value = value.replace('  const { id } = await context.params;\n  try {', '  const { id } = await context.params;\n  const accessError = await requireCrmCustomerAccess(id, auth.staff);\n  if (accessError) return accessError;\n  try {')
              else:
                  value = value.replace('  const { id, rateId } = await context.params;\n  try {', '  const { id, rateId } = await context.params;\n  const accessError = await requireCrmCustomerAccess(id, auth.staff);\n  if (accessError) return accessError;\n  try {')
              write(path, value)

          # Profile editor: customer relationship is non-removable; outstanding AR is read-only/derived.
          path = 'app/admin/crm/[id]/crm-customer-profile-editor.tsx'
          replace(path, '    outstandingBalance: customer.commercial.outstanding_balance?.toString() ?? "",\n', '')
          replace(path, '        delete payload.outstandingBalance;\n', '')
          replace(path, '  function toggleRelationship(type: CrmRelationshipType) {\n    setForm((current) => ({', '  function toggleRelationship(type: CrmRelationshipType) {\n    if (type === "customer") return;\n    setForm((current) => ({')
          replace(path, 'onClick={() => toggleRelationship(type)} className={`rounded-full', 'onClick={() => toggleRelationship(type)} disabled={type === "customer"} className={`rounded-full')
          replace(path, '''            <Field label="Outstanding balance"><input inputMode="decimal" className="crm360-input" value={form.outstandingBalance} onChange={(event) => field("outstandingBalance", event.target.value)} /></Field>''', '''            <Field label="Outstanding balance"><div className="crm360-input flex items-center bg-[#f4f1ed] text-[#6f6862]">{customer.commercial.outstanding_balance === null ? "No receivable balance" : `${customer.preferred_currency} ${customer.commercial.outstanding_balance.toLocaleString("en-AU", { maximumFractionDigits: 2 })}`} · calculated from Receivables</div></Field>''')

          # Tests for the pure policy layer.
          path = 'tests/rbac-security.test.mjs'
          value = text(path)
          value = value.replace('import { adminSecurityConfigIssues } from "../app/admin/admin-security-config.ts";\n', 'import { adminSecurityConfigIssues } from "../app/admin/admin-security-config.ts";\nimport { crmAccountStatusChangeError, hasCustomerRelationship, normalizeNepalDateTimeInput, validCalendarDate } from "../app/admin/crm/crm-policy.ts";\n')
          value += '''\n\ntest("customer records cannot lose their buyer relationship", () => {\n  assert.equal(hasCustomerRelationship(["customer"]), true);\n  assert.equal(hasCustomerRelationship(["supplier"]), false);\n});\n\ntest("credit holds require credit-control permission and blacklisting requires Management", () => {\n  const operations = staffCapabilitiesForRole("operations");\n  const accounts = staffCapabilitiesForRole("accounts");\n  const management = staffCapabilitiesForRole("management");\n  assert.ok(crmAccountStatusChangeError("active", "on_hold", operations));\n  assert.equal(crmAccountStatusChangeError("active", "on_hold", accounts), null);\n  assert.ok(crmAccountStatusChangeError("active", "blacklisted", accounts));\n  assert.equal(crmAccountStatusChangeError("active", "blacklisted", management), null);\n});\n\ntest("CRM date helpers reject impossible dates and normalize Nepal-local follow-ups", () => {\n  assert.equal(validCalendarDate("2026-02-31"), false);\n  assert.equal(validCalendarDate("2026-02-28"), true);\n  assert.equal(normalizeNepalDateTimeInput("2026-08-21T10:30"), "2026-08-21T04:45:00.000Z");\n  assert.equal(normalizeNepalDateTimeInput("2026-02-31T10:30"), null);\n});\n'''
          write(path, value)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests
          git commit -m "Harden customer RBAC and CRM data truth"
          git push origin HEAD:audit/customers-v1
