name: Refresh security lockfile

on:
  push:
    branches: [audit/production-dependency-security]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/production-dependency-security

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Upgrade patched Next packages
        run: |
          npm install --save-exact next@16.3.2
          npm install --save-dev --save-exact @next/eslint-plugin-next@16.3.2

      - name: Verify production dependency security
        run: npm audit --omit=dev --audit-level=high

      - name: Commit package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Package metadata is already current"
          else
            git commit -m "Upgrade Next to patched 16.3.2 release"
            git push origin HEAD:audit/production-dependency-security
          fi
