name: Apply KCPL Operations v4 targeted refinements

on:
  push:
    branches: [redesign/operations-os-v4]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/operations-os-v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Apply targeted refinements
        run: node scripts/apply-operations-v4-targeted.cjs
      - name: Commit refinements
        run: |
          if git diff --quiet; then
            echo "No targeted refinements left to apply."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/admin-dashboard.tsx app/admin/shipments/shipments-workspace.tsx app/admin/alerts/alerts-workspace.tsx app/admin/crm/crm-dashboard.tsx app/admin/partners/partners-workspace.tsx app/admin/finance/finance-workspace.tsx
          git commit -m "Refine core KCPL operational workspaces"
          git push origin HEAD:redesign/operations-os-v4
