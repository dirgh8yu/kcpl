            return { id: "RATE-1", partner_id: "P-1", partner_name: "Partner", branch, origin: "Kathmandu", destination: "Birgunj", mode: "road", service: null, equipment: null, currency: "NPR", rate: 100, unit: "flat", minimum_charge: null, fuel_surcharge_percent: 0, accessorial_flat: 0, transit_days_min: null, transit_days_max: null, valid_from: null, valid_until: null, active: true, notes: null, created_at: "", updated_at: "" };
          }

          test("1 stale V1 TMS quote acceptance re-reads current order version", () => { assert.match(customerAuthority, /commercial_version_id.*versionId[\\s\\S]*commercial_fingerprint.*fingerprint/); assert.match(customerAuthority, /stale_commercial_quote/); });
          test("2 TMS quote Won never creates a generic shipment", () => { assert.match(quoteRoute, /if \(status === "won" && !acceptedTmsQuote\)/); assert.match(quoteRoute, /acceptCurrentTmsCustomerQuote/); });
          test("3 GET quote is read-only with respect to shipment creation", () => { assert.doesNotMatch(adminData, /ensureShipmentForWonQuote/); assert.match(adminData, /getShipmentForQuote/); });
          test("4 direct quote API classifies TMS by durable server facts", () => { assert.equal(quoteHasTmsAuthorityMarkers({ transport_order_id: "ORD-1", commercial_version_id: "CV-1" }), true); assert.equal(quoteHasTmsAuthorityMarkers({ source: "legacy_web_quote" }), false); });
          test("5 non-TMS quote keeps explicit mutation shipment path", () => { assert.match(quoteRoute, /ensureShipmentForWonQuote\(reference/); assert.match(shipmentServer, /export async function ensureShipmentForWonQuote/); });
          test("6 current TMS customer acceptance is deterministic and idempotent", () => { assert.match(customerAuthority, /commercial_customer_acceptances/); assert.match(customerAuthority, /idempotent: true/); });

          test("7 request approval threshold cannot redefine policy", () => { assert.match(pricingRoute, /COMMERCIAL_POLICY_SERVER_OWNED/); });
          test("8 Accounts cannot override commercial policy", () => { assert.equal(staffCapabilitiesForRole("accounts").canOverrideCommercialPolicy, false); });
          test("9 Commercial cannot override commercial policy", () => { assert.equal(staffCapabilitiesForRole("commercial").canOverrideCommercialPolicy, false); });
          test("10 server policy is authoritative", () => { assert.match(pricingServer, /minimum_margin_percent: COMMERCIAL_MINIMUM_MARGIN_PERCENT/); assert.match(pricingServer, /approval_below_margin_percent: COMMERCIAL_APPROVAL_BELOW_MARGIN_PERCENT/); });
          test("11 Accounts arbitrary manual FX is blocked", () => { assert.equal(staffCapabilitiesForRole("accounts").canOverrideFx, false); });
          test("12 Commercial arbitrary manual FX is blocked", () => { assert.equal(staffCapabilitiesForRole("commercial").canOverrideFx, false); });
          test("13 Management manual FX override is explicit and audited", () => { assert.equal(staffCapabilitiesForRole("management").canOverrideFx, true); assert.match(pricingServer, /override_actor_email/); assert.match(pricingServer, /override_reason/); assert.match(pricingServer, /override_at/); });
          test("14 auto FX is server-derived NRB", () => { assert.match(pricingRoute, /manualFx \? "manual" : "nrb"/); assert.match(pricingServer, /getNrbForexSnapshot/); });
          test("15 policy or FX provenance changes fingerprint", () => { const a = commercialSnapshot(); const b = commercialSnapshot({ pricing: { pricing_policy_id: "policy-v2" } }); assert.notEqual(commercialFingerprint(a), commercialFingerprint(b)); const c = commercialSnapshot({ fx: { source: "manual_override", override_actor_name: "Manager", override_actor_email: "m@kcpl.test", override_reason: "contract", override_at: "2026-08-23T00:00:00.000Z" } }); assert.notEqual(commercialFingerprint(a), commercialFingerprint(c)); });
          test("16 old approval remains exact-version only", () => { assert.match(tenderServer, /assertBookableCommercialVersionInTransaction/); assert.match(pricingServer, /stale_commercial_state/); });

          test("17 exact V1 customer authority permits V1 booking path", () => { assert.match(tenderServer, /assertCustomerSellAuthorityInTransaction\(transaction, version\)/); });
          test("18 V1 authority cannot permit V2 booking", () => { assert.match(customerAuthority, /record\.commercial_version_id === version\.id/); assert.match(customerAuthority, /record\.commercial_fingerprint === version\.fingerprint/); });
          test("19 V2 authority permits V2 after exact acceptance", () => { assert.match(customerAuthority, /transaction\.create\(acceptanceRef\(version\.id\)/); });
          test("20 booking without customer authority is blocked", () => { assert.match(tenderRoute, /customer_acceptance_required/); });
          test("21 wrong customer authority is blocked", () => { assert.match(customerAuthority, /record\.customer_id === customerId/); });
          test("22 wrong order authority is blocked", () => { assert.match(customerAuthority, /record\.order_id === normalizeCommercialId\(version\.snapshot\.order_id\)/); });
          test("23 wrong fingerprint authority is blocked", () => { assert.match(customerAuthority, /record\.commercial_fingerprint === version\.fingerprint/); });
          test("24 wrong sell amount or currency is blocked", () => { assert.match(customerAuthority, /sameCommercialMoney\(record\.sell_amount, pricing\.sell_amount/); assert.match(customerAuthority, /record\.sell_currency === sellCurrency/); });
          test("25 booking and authority race shares one Firestore transaction read set", () => { assert.match(tenderServer, /db\.runTransaction/); assert.match(customerAuthority, /transaction\.get\(acceptanceRef\(version\.id\)\)/); });
          test("26 consolidation stale house authority fails atomically", () => { assert.match(consolidation, /assertCustomerSellAuthorityInTransaction\(transaction, source\.version\)/); assert.match(consolidation, /db\.runTransaction/); });
          test("27 internal booking bridge alone is not customer acceptance", () => { assert.match(customerAuthority, /source.*tms_sell_pricing_engine/); assert.match(tenderServer, /source: "tms_order_booking_bridge"/); });

          test("28 same-branch rate card is applicable", () => { assert.equal(rateCardAppliesToOrder(order("Kathmandu"), card("Kathmandu")), true); });
          test("29 Global rate card is applicable", () => { assert.equal(rateCardAppliesToOrder(order("Kathmandu"), card("Global")), true); });
          test("30 wrong-branch rate card is blocked", () => { assert.equal(rateCardAppliesToOrder(order("Kathmandu"), card("Birgunj")), false); });
          test("31 Management all-branch access cannot change rate applicability", () => { assert.equal(staffCapabilitiesForRole("management").canManageRateCards, true); assert.equal(rateCardAppliesToOrder(order("Kathmandu"), card("Birgunj")), false); });
          test("32 Commercial multi-branch visibility cannot change rate applicability", () => { assert.equal(staffCapabilitiesForRole("commercial").canManageRateCards, true); assert.equal(rateCardAppliesToOrder(order("Kathmandu"), card("Birgunj")), false); });
          test("33 malformed card or order branch fails closed", () => { assert.equal(rateCardAppliesToOrder(order("Unknown"), card("Kathmandu")), false); assert.equal(rateCardAppliesToOrder(order("Kathmandu"), card("Unknown")), false); });
          test("34 rate-card branch provenance is fingerprinted", () => { const a = commercialSnapshot(); const b = commercialSnapshot({ procurement: { rate_card_branch: "Global" } }); assert.notEqual(commercialFingerprint(a), commercialFingerprint(b)); });
          test("35 historical commercial version stores rate-card scope", () => { assert.match(ratingServer, /rate_card_branch: card\.branch/); assert.match(ratingServer, /rate_card_origin: card\.origin/); assert.match(ratingServer, /rate_card_destination: card\.destination/); });
          test("36 later rate-card branch edit cannot rewrite historical scope", () => { assert.match(ratingServer, /selectedRateSnapshot\(order, card, result\)/); assert.match(ratingServer, /persistCommercialVersionInTransaction/); });
          test("37 legacy reconstruction rejects current wrong-branch card", () => { assert.match(lineageServer, /legacy_rate_card_branch_mismatch/); });

          test("38 V1 acceptance versus V2 repricing is serialized by current order read", () => { assert.match(customerAuthority, /const order = await transaction\.get\(orderRef\)/); assert.match(pricingServer, /const orderSnapshot = await transaction\.get\(orderRef\)/); });
          test("39 buy-only counteroffer can explicitly carry exact customer sell authority", () => { assert.equal(customerSellEconomicsMatch(commercialSnapshot(), commercialSnapshot({ procurement: { total: 110 } })), true); assert.match(tenderServer, /carryForwardCustomerSellAuthorityInTransaction/); });
          test("40 sell change cannot carry customer authority", () => { assert.equal(customerSellEconomicsMatch(commercialSnapshot(), commercialSnapshot({ pricing: { sell_amount: 121 } })), false); });
          test("41 rate-card edit versus selection uses current card in transaction", () => { assert.match(ratingServer, /transaction\.get\(db\.collection\("partner_rate_cards"\)\.doc\(rateCardId\)\)/); });
          test("42 approval versus repricing remains exact-version CAS", () => { assert.match(pricingServer, /commercial_version_id.*expectedId/); assert.match(pricingServer, /commercial_fingerprint.*expectedFp/); });
          test("43 manual FX versus booking consumes exact persisted version", () => { assert.match(tenderServer, /tenderCommercialVersionInTransaction/); assert.match(tenderServer, /orderPointer\.id !== version\.id/); });
          test("44 generic Won versus TMS booking cannot produce two TMS shipment authorities", () => { assert.match(quoteRoute, /!acceptedTmsQuote/); assert.match(tenderServer, /commercialBookedSnapshotFields\(version\)/); });

          test("45 #126 settlement lineage remains present", () => { assert.match(financeSettlement, /resolveBookedCommercialLineage/); });
          test("46 #127 booking retry authority remains present", () => { assert.match(tenderServer, /bookingRetryDecision/); });
          test("47 #128 RBAC remains server-enforced", () => { assert.match(quoteRoute, /getStaffContext/); assert.match(pricingRoute, /getStaffContext/); });
          test("48 #129 immutable commercial lineage remains present", () => { assert.match(pricingServer, /persistCommercialVersionInTransaction/); assert.match(ratingServer, /persistCommercialVersionInTransaction/); });
          test("49 #130 external workflow authority remains present", () => { assert.match(externalWorkflow, /Delivered|delivered/); });
          test("50 Accounts finance permission remains functional without override authority", () => { const accounts = staffCapabilitiesForRole("accounts"); assert.equal(accounts.canManageFinance, true); assert.equal(accounts.canEditCommercial, true); assert.equal(accounts.canOverrideFx, false); });
          ''')

          pkg_path = root / 'package.json'
          pkg = json.loads(pkg_path.read_text())
          suite = 'tests/commercial-authority-seams.test.mjs'
          if suite not in pkg['scripts']['test']:
              pkg['scripts']['test'] += ' ' + suite
          pkg_path.write_text(json.dumps(pkg, indent=2) + '\n')
          PY
          python /tmp/patch.py

      - name: Install dependencies
        run: npm ci

      - name: Dedicated authority tests
        run: node --experimental-strip-types --test tests/commercial-authority-seams.test.mjs

      - name: Type check patched tree
        run: npx tsc --noEmit

      - name: Commit remediation
        shell: bash
        run: |
          rm .github/workflows/remediation-commercial-authority.yml
          git config user.name "KCPL Remediation Agent 6"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden commercial authority seams"
          git push origin HEAD:fix/commercial-authority-seams
