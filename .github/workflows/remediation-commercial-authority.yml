name: Apply commercial authority remediation

on:
  push:
    branches: [fix/commercial-authority-seams]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/commercial-authority-seams
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply scoped remediation
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')

          def read(path):
              return (root / path).read_text()

          def write(path, content):
              p = root / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          # Pure commercial authority policy and predicates.
          write('app/admin/commercial-authority/commercial-authority.ts', '''import {
            normalizeCommercialCurrency,
            normalizeCommercialId,
            sameCommercialMoney,
            type CommercialSnapshot,
          } from "../commercial-lineage/commercial-lineage";

          export const COMMERCIAL_POLICY_ID = "kcpl-server-commercial-policy-v1";
          export const COMMERCIAL_MINIMUM_MARGIN_PERCENT = 10;
          export const COMMERCIAL_APPROVAL_BELOW_MARGIN_PERCENT = 12;

          function text(value: unknown) {
            return typeof value === "string" ? value.trim() : "";
          }

          export function tmsCustomerQuoteReference(orderId: string, versionId: string) {
            return `TMSSELL-${normalizeCommercialId(orderId)}-${normalizeCommercialId(versionId)}`
              .replace(/[^A-Z0-9-]/gi, "")
              .toUpperCase()
              .slice(0, 120);
          }

          export function quoteHasTmsAuthorityMarkers(data: Record<string, unknown>) {
            const source = text(data.source).toLowerCase();
            return Boolean(
              normalizeCommercialId(data.transport_order_id)
              || normalizeCommercialId(data.commercial_version_id)
              || text(data.commercial_fingerprint)
              || data.commercial_locked === true
              || source.startsWith("tms_"),
            );
          }

          export function customerSellEconomicsMatch(left: CommercialSnapshot, right: CommercialSnapshot) {
            const leftPricing = left.pricing;
            const rightPricing = right.pricing;
            if (!leftPricing || !rightPricing) return false;
            const currency = normalizeCommercialCurrency(leftPricing.sell_currency);
            return Boolean(
              normalizeCommercialId(left.order_id) === normalizeCommercialId(right.order_id)
              && left.branch === right.branch
              && normalizeCommercialId(left.customer_id) === normalizeCommercialId(right.customer_id)
              && normalizeCommercialId(leftPricing.customer_id) === normalizeCommercialId(rightPricing.customer_id)
              && currency
              && currency === normalizeCommercialCurrency(rightPricing.sell_currency)
              && sameCommercialMoney(leftPricing.sell_amount, rightPricing.sell_amount, currency),
            );
          }
          ''')

          # Transactional customer quote and acceptance authority.
          write('app/admin/commercial-authority/customer-sell-authority.server.ts', '''import { firebaseAdminDb, firebaseRuntimeConfigured } from "../../firebase-admin.server";
          import {
            loadCommercialVersionInTransaction,
          } from "../commercial-lineage/commercial-lineage.server";
          import {
            normalizeCommercialCurrency,
            normalizeCommercialId,
            sameCommercialMoney,
            type CommercialVersion,
          } from "../commercial-lineage/commercial-lineage";
          import { kcplBranches, type KcplBranch } from "../crm/crm-data";
          import { staffCanAccessBranch, type KcplStaffContext } from "../staff-directory.server";
          import {
            customerSellEconomicsMatch,
            quoteHasTmsAuthorityMarkers,
            tmsCustomerQuoteReference,
          } from "./commercial-authority";

          type Actor = { name: string; email: string };

          export type CustomerSellAuthorityFailure =
            | "customer_quote_required"
            | "customer_quote_stale"
            | "customer_acceptance_required";

          type CustomerAcceptanceRecord = {
            commercial_version_id: string;
            commercial_fingerprint: string;
            order_id: string;
            customer_id: string;
            quote_reference: string;
            sell_amount: number;
            sell_currency: string;
            accepted_at: string;
            accepted_by_name: string;
            accepted_by_email: string;
            acceptance_source: string;
          };

          function text(value: unknown) { return typeof value === "string" ? value.trim() : ""; }
          function branchValue(value: unknown): KcplBranch | null { return kcplBranches.includes(value as KcplBranch) ? value as KcplBranch : null; }
          function acceptanceRef(versionId: string) { return firebaseAdminDb().collection("commercial_customer_acceptances").doc(normalizeCommercialId(versionId)); }

          function acceptanceFromData(data: Record<string, unknown>): CustomerAcceptanceRecord | null {
            const sellAmount = Number(data.sell_amount);
            const sellCurrency = normalizeCommercialCurrency(data.sell_currency);
            const record: CustomerAcceptanceRecord = {
              commercial_version_id: normalizeCommercialId(data.commercial_version_id),
              commercial_fingerprint: text(data.commercial_fingerprint),
              order_id: normalizeCommercialId(data.order_id),
              customer_id: normalizeCommercialId(data.customer_id),
              quote_reference: normalizeCommercialId(data.quote_reference),
              sell_amount: sellAmount,
              sell_currency: sellCurrency,
              accepted_at: text(data.accepted_at),
              accepted_by_name: text(data.accepted_by_name),
              accepted_by_email: text(data.accepted_by_email).toLowerCase(),
              acceptance_source: text(data.acceptance_source),
            };
            return data.status === "accepted"
              && record.commercial_version_id
              && record.commercial_fingerprint
              && record.order_id
              && record.customer_id
              && record.quote_reference
              && Number.isFinite(record.sell_amount)
              && record.sell_amount >= 0
              && record.sell_currency
              && record.accepted_at
              && record.accepted_by_email
              && record.acceptance_source
              ? record
              : null;
          }

          function acceptanceMatchesVersion(record: CustomerAcceptanceRecord, version: CommercialVersion) {
            const pricing = version.snapshot.pricing;
            const customerId = normalizeCommercialId(version.snapshot.customer_id);
            if (!pricing || !customerId) return false;
            const sellCurrency = normalizeCommercialCurrency(pricing.sell_currency);
            return Boolean(
              record.commercial_version_id === version.id
              && record.commercial_fingerprint === version.fingerprint
              && record.order_id === normalizeCommercialId(version.snapshot.order_id)
              && record.customer_id === customerId
              && record.sell_currency === sellCurrency
              && sameCommercialMoney(record.sell_amount, pricing.sell_amount, sellCurrency),
            );
          }

          export async function assertCustomerQuoteIssuedInTransaction(
            transaction: FirebaseFirestore.Transaction,
            version: CommercialVersion,
          ): Promise<{ ok: true; quoteReference: string } | { ok: false; reason: CustomerSellAuthorityFailure }> {
            const customerId = normalizeCommercialId(version.snapshot.customer_id);
            const pricing = version.snapshot.pricing;
            if (!customerId || !pricing) return { ok: false, reason: "customer_quote_required" };
            const reference = tmsCustomerQuoteReference(version.snapshot.order_id, version.id);
            const quote = await transaction.get(firebaseAdminDb().collection("quotes").doc(reference));
            if (!quote.exists) return { ok: false, reason: "customer_quote_required" };
            const quoteBranch = text(quote.get("branch"));
            const sellCurrency = normalizeCommercialCurrency(pricing.sell_currency);
            if (
              text(quote.get("source")) !== "tms_sell_pricing_engine"
              || quote.get("commercial_locked") !== true
              || normalizeCommercialId(quote.get("transport_order_id")) !== normalizeCommercialId(version.snapshot.order_id)
              || normalizeCommercialId(quote.get("customer_id")) !== customerId
              || normalizeCommercialId(quote.get("commercial_version_id")) !== version.id
              || text(quote.get("commercial_fingerprint")) !== version.fingerprint
              || (quoteBranch && quoteBranch !== version.snapshot.branch)
              || normalizeCommercialCurrency(quote.get("quote_currency")) !== sellCurrency
              || !sameCommercialMoney(quote.get("quoted_amount"), pricing.sell_amount, sellCurrency)
            ) return { ok: false, reason: "customer_quote_stale" };
            return { ok: true, quoteReference: reference };
          }

          export async function assertCustomerSellAuthorityInTransaction(
            transaction: FirebaseFirestore.Transaction,
            version: CommercialVersion,
          ): Promise<{ ok: true; quoteReference: string; acceptance: CustomerAcceptanceRecord } | { ok: false; reason: CustomerSellAuthorityFailure }> {
            const customerId = normalizeCommercialId(version.snapshot.customer_id);
            const pricing = version.snapshot.pricing;
            if (!customerId || !pricing) return { ok: false, reason: "customer_quote_required" };
            const snapshot = await transaction.get(acceptanceRef(version.id));
            if (!snapshot.exists) return { ok: false, reason: "customer_acceptance_required" };
            const record = acceptanceFromData(snapshot.data() as Record<string, unknown>);
            if (!record || !acceptanceMatchesVersion(record, version)) return { ok: false, reason: "customer_quote_stale" };
            return { ok: true, quoteReference: record.quote_reference, acceptance: record };
          }

          export async function carryForwardCustomerSellAuthorityInTransaction(
            transaction: FirebaseFirestore.Transaction,
            sourceVersion: CommercialVersion,
            derivedVersion: CommercialVersion,
            actor: Actor,
          ) {
            if (!customerSellEconomicsMatch(sourceVersion.snapshot, derivedVersion.snapshot)) return { kind: "not_carried" as const };
            const source = await assertCustomerSellAuthorityInTransaction(transaction, sourceVersion);
            if (!source.ok) return { kind: "not_carried" as const };
            const ref = acceptanceRef(derivedVersion.id);
            const existing = await transaction.get(ref);
            if (existing.exists) {
              const record = acceptanceFromData(existing.data() as Record<string, unknown>);
              return record && acceptanceMatchesVersion(record, derivedVersion)
                ? { kind: "carried" as const, quoteReference: record.quote_reference, idempotent: true }
                : { kind: "conflict" as const };
            }
            const pricing = derivedVersion.snapshot.pricing!;
            const now = new Date().toISOString();
            transaction.create(ref, {
              status: "accepted",
              commercial_version_id: derivedVersion.id,
              commercial_fingerprint: derivedVersion.fingerprint,
              order_id: normalizeCommercialId(derivedVersion.snapshot.order_id),
              customer_id: normalizeCommercialId(derivedVersion.snapshot.customer_id),
              quote_reference: source.quoteReference,
              sell_amount: pricing.sell_amount,
              sell_currency: normalizeCommercialCurrency(pricing.sell_currency),
              accepted_at: source.acceptance.accepted_at,
              accepted_by_name: source.acceptance.accepted_by_name,
              accepted_by_email: source.acceptance.accepted_by_email,
              acceptance_source: source.acceptance.acceptance_source,
              authority_derivation: "buy_side_only_carry_forward",
              source_commercial_version_id: sourceVersion.id,
              source_commercial_fingerprint: sourceVersion.fingerprint,
              carried_forward_at: now,
              carried_forward_by_name: actor.name,
              carried_forward_by_email: actor.email,
              immutable: true,
              created_at: now,
            });
            return { kind: "carried" as const, quoteReference: source.quoteReference, idempotent: false };
          }

          export async function acceptCurrentTmsCustomerQuote(
            quoteReference: string,
            actor: Actor,
            staff: KcplStaffContext,
          ) {
            if (!firebaseRuntimeConfigured()) return { kind: "unavailable" as const };
            if (!staff.permissions.canEditCommercial) return { kind: "forbidden" as const };
            const db = firebaseAdminDb();
            const reference = normalizeCommercialId(quoteReference);
            const quoteRef = db.collection("quotes").doc(reference);
            try {
              return await db.runTransaction(async (transaction) => {
                const quote = await transaction.get(quoteRef);
                if (!quote.exists) return { kind: "missing" as const };
                const quoteData = quote.data() as Record<string, unknown>;
                if (!quoteHasTmsAuthorityMarkers(quoteData)) return { kind: "not_tms" as const };
                if (text(quote.get("source")) !== "tms_sell_pricing_engine" || quote.get("commercial_locked") !== true) return { kind: "invalid_tms_quote" as const };
                const orderId = normalizeCommercialId(quote.get("transport_order_id"));
                const versionId = normalizeCommercialId(quote.get("commercial_version_id"));
                const fingerprint = text(quote.get("commercial_fingerprint"));
                if (!orderId || !versionId || !fingerprint || reference !== tmsCustomerQuoteReference(orderId, versionId)) return { kind: "invalid_tms_quote" as const };
                const orderRef = db.collection("transport_orders").doc(orderId);
                const order = await transaction.get(orderRef);
                if (!order.exists) return { kind: "missing_order" as const };
                const branch = branchValue(order.get("branch"));
                if (!branch || !staffCanAccessBranch(staff, branch)) return { kind: "forbidden" as const };
                if (normalizeCommercialId(order.get("commercial_version_id")) !== versionId || text(order.get("commercial_fingerprint")) !== fingerprint) return { kind: "stale_commercial_quote" as const };
                const resolved = await loadCommercialVersionInTransaction(transaction, versionId, fingerprint, orderId);
                if (resolved.kind !== "ready") return { kind: "stale_commercial_quote" as const };
                const version = resolved.version;
                const pricing = version.snapshot.pricing;
                const customerId = normalizeCommercialId(version.snapshot.customer_id);
                if (!pricing || !customerId || version.snapshot.branch !== branch) return { kind: "invalid_tms_quote" as const };
                const customer = await transaction.get(db.collection("customers").doc(customerId));
                if (!customer.exists || customer.get("archived") === true || branchValue(customer.get("primary_branch")) !== branch) return { kind: "customer_missing" as const };
                const issued = await assertCustomerQuoteIssuedInTransaction(transaction, version);
                if (!issued.ok) return { kind: "stale_commercial_quote" as const };
                const status = text(quote.get("status"));
                if (status !== "quoted" && status !== "won") return { kind: "invalid_transition" as const };
                const acceptanceDoc = await transaction.get(acceptanceRef(version.id));
                if (acceptanceDoc.exists) {
                  const existing = acceptanceFromData(acceptanceDoc.data() as Record<string, unknown>);
                  if (!existing || !acceptanceMatchesVersion(existing, version) || existing.quote_reference !== reference) return { kind: "stale_commercial_quote" as const };
                  if (status !== "won" || text(quote.get("customer_acceptance_status")) !== "accepted") {
                    transaction.update(quoteRef, { status: "won", customer_acceptance_status: "accepted", updated_at: new Date().toISOString() });
                  }
                  return { kind: "accepted" as const, quoteReference: reference, commercialVersionId: version.id, idempotent: true };
                }
                const now = new Date().toISOString();
                const sellCurrency = normalizeCommercialCurrency(pricing.sell_currency);
                const acceptance = {
                  status: "accepted",
                  commercial_version_id: version.id,
                  commercial_fingerprint: version.fingerprint,
                  order_id: orderId,
                  customer_id: customerId,
                  quote_reference: reference,
                  sell_amount: pricing.sell_amount,
                  sell_currency: sellCurrency,
                  accepted_at: now,
                  accepted_by_name: actor.name,
                  accepted_by_email: actor.email.toLowerCase(),
                  acceptance_source: "kcpl_staff_recorded_customer_acceptance",
                  authority_derivation: "exact_customer_quote",
                  source_commercial_version_id: version.id,
                  source_commercial_fingerprint: version.fingerprint,
                  immutable: true,
                  created_at: now,
                };
                transaction.create(acceptanceRef(version.id), acceptance);
                transaction.update(quoteRef, {
                  status: "won",
                  customer_acceptance_status: "accepted",
                  accepted_at: now,
                  accepted_by_name: actor.name,
                  accepted_by_email: actor.email.toLowerCase(),
                  accepted_by_source: "kcpl_staff_recorded_customer_acceptance",
                  accepted_order_id: orderId,
                  accepted_customer_id: customerId,
                  accepted_commercial_version_id: version.id,
                  accepted_commercial_fingerprint: version.fingerprint,
                  accepted_sell_amount: pricing.sell_amount,
                  accepted_sell_currency: sellCurrency,
                  updated_at: now,
                });
                return { kind: "accepted" as const, quoteReference: reference, commercialVersionId: version.id, idempotent: false };
              });
            } catch {
              return { kind: "unavailable" as const };
            }
          }
          ''')

          # Staff capabilities: preserve commercial/finance roles but make overrides Management-only.
          replace_once('app/admin/staff-permissions.ts',
            '  canEditCommercial: boolean;\n  canManageRateCards: boolean;',
            '  canEditCommercial: boolean;\n  canOverrideCommercialPolicy: boolean;\n  canOverrideFx: boolean;\n  canManageRateCards: boolean;')
          replace_once('app/admin/staff-permissions.ts',
            '    canEditCommercial: management || accounts || commercial,\n    canManageRateCards: management || commercial,',
            '    canEditCommercial: management || accounts || commercial,\n    canOverrideCommercialPolicy: management,\n    canOverrideFx: management,\n    canManageRateCards: management || commercial,')

          # Commercial snapshot provenance additions, backward compatible with existing v1 fingerprints.
          replace_once('app/admin/commercial-lineage/commercial-lineage.ts',
            '  source_npr_per_unit: number | null;\n  target_npr_per_unit: number | null;\n};',
            '  source_npr_per_unit: number | null;\n  target_npr_per_unit: number | null;\n  override_actor_name?: string | null;\n  override_actor_email?: string | null;\n  override_reason?: string | null;\n  override_at?: string | null;\n};')
          replace_once('app/admin/commercial-lineage/commercial-lineage.ts',
            '  rate_card_id: string | null;\n  rate_card_updated_at: string | null;',
            '  rate_card_id: string | null;\n  rate_card_branch?: string | null;\n  rate_card_origin?: string | null;\n  rate_card_destination?: string | null;\n  rate_card_updated_at: string | null;')
          replace_once('app/admin/commercial-lineage/commercial-lineage.ts',
            '  pricing_rule_id: string | null;\n  pricing_rule_scope: string | null;',
            '  pricing_rule_id: string | null;\n  pricing_rule_scope: string | null;\n  pricing_policy_id?: string | null;')

          path = 'app/admin/commercial-lineage/commercial-lineage.ts'
          text0 = read(path)
          marker = 'export function commercialFingerprintPayload(snapshot: CommercialSnapshot) {'
          start = text0.index(marker)
          end = text0.index('\n}\n\nexport function commercialFingerprint(', start) + 2
          block = text0[start:end]
          block = block.replace(
            '  const sellCurrency = snapshot.pricing ? normalizeCommercialCurrency(snapshot.pricing.sell_currency) : "";\n  return [',
            '''  const sellCurrency = snapshot.pricing ? normalizeCommercialCurrency(snapshot.pricing.sell_currency) : "";
  const rateApplicability = ("rate_card_branch" in snapshot.procurement || "rate_card_origin" in snapshot.procurement || "rate_card_destination" in snapshot.procurement)
    ? [nullableText(snapshot.procurement.rate_card_branch), nullableText(snapshot.procurement.rate_card_origin), nullableText(snapshot.procurement.rate_card_destination)]
    : null;
  const pricingPolicy = snapshot.pricing && "pricing_policy_id" in snapshot.pricing ? nullableText(snapshot.pricing.pricing_policy_id) : null;
  const manualFxProvenance = snapshot.fx && snapshot.fx.source === "manual_override" && ("override_reason" in snapshot.fx || "override_actor_email" in snapshot.fx || "override_at" in snapshot.fx)
    ? [nullableText(snapshot.fx.override_actor_name), nullableText(snapshot.fx.override_actor_email), nullableText(snapshot.fx.override_reason), nullableText(snapshot.fx.override_at)]
    : null;
  const payload = [''', 1)
          if block.count('  ];\n}') != 1:
              raise SystemExit('fingerprint payload tail match failed')
          block = block.replace('  ];\n}', '''  ];
  const provenance: unknown[] = [];
  if (rateApplicability) provenance.push(["rate_applicability", ...rateApplicability]);
  if (pricingPolicy) provenance.push(["pricing_policy", pricingPolicy]);
  if (manualFxProvenance) provenance.push(["manual_fx", ...manualFxProvenance]);
  return provenance.length ? [...payload, ...provenance] : payload;
}''', 1)
          write(path, text0[:start] + block + text0[end:])
          replace_once(path,
            '  const procurementTotal = commercialMoney(snapshot.procurement.total, procurementCurrency);\n  if (procurementTotal === null || procurementTotal < 0) errors.push("invalid_procurement_total");',
            '''  const procurementTotal = commercialMoney(snapshot.procurement.total, procurementCurrency);
  if (procurementTotal === null || procurementTotal < 0) errors.push("invalid_procurement_total");
  if ("rate_card_branch" in snapshot.procurement) {
    const rateBranch = text(snapshot.procurement.rate_card_branch);
    if (!rateBranch) errors.push("missing_rate_card_branch");
    else if (rateBranch !== "Global" && rateBranch !== text(snapshot.branch)) errors.push("rate_card_branch_mismatch");
  }''')
          replace_once(path,
            '    if (snapshot.fx) {\n      if (normalizeCommercialCurrency(snapshot.fx.source_currency) !== procurementCurrency) errors.push("fx_source_mismatch");',
            '''    if (snapshot.fx) {
      if (normalizeCommercialCurrency(snapshot.fx.source_currency) !== procurementCurrency) errors.push("fx_source_mismatch");
      if (snapshot.fx.source === "manual_override" && ("override_reason" in snapshot.fx || "override_actor_email" in snapshot.fx || "override_at" in snapshot.fx)) {
        if (!text(snapshot.fx.override_actor_email) || !text(snapshot.fx.override_reason) || !text(snapshot.fx.override_at)) errors.push("manual_fx_provenance_missing");
      }''')

          # Rating applicability is commercial validity, not staff visibility.
          replace_once('app/admin/rating/tms-rating.ts',
            'import type { CrmCurrency, KcplBranch } from "../crm/crm-data";',
            'import { kcplBranches, type CrmCurrency, type KcplBranch } from "../crm/crm-data";')
          replace_once('app/admin/rating/tms-rating.ts',
            'export function calculateRating(order: TmsOrder, card: PartnerBuyRateCard): RatingResult | null {\n  if (order.mode !== card.mode && card.mode !== "multimodal") return null;\n  if (!rateLocationMatches(card.origin, order.origin) || !rateLocationMatches(card.destination, order.destination)) return null;\n  if (order.equipment && card.equipment && key(order.equipment) !== key(card.equipment)) return null;\n  if (!rateCardIsValidOn(card, order.pickup_date || new Date().toISOString())) return null;\n\n  const quantity = ratingQuantity(order, card.unit);\n  if (quantity <= 0 && !["flat", "per_shipment"].includes(card.unit)) return null;',
            '''export function rateCardAppliesToOrder(order: TmsOrder, card: PartnerBuyRateCard, dateIso = order.pickup_date || new Date().toISOString()) {
  if (!kcplBranches.includes(order.branch)) return false;
  if (card.branch !== "Global" && (!kcplBranches.includes(card.branch) || card.branch !== order.branch)) return false;
  if (order.mode !== card.mode && card.mode !== "multimodal") return false;
  if (!rateLocationMatches(card.origin, order.origin) || !rateLocationMatches(card.destination, order.destination)) return false;
  if (order.equipment && card.equipment && key(order.equipment) !== key(card.equipment)) return false;
  if (!rateCardIsValidOn(card, dateIso)) return false;
  const quantity = ratingQuantity(order, card.unit);
  if (quantity <= 0 && !["flat", "per_shipment"].includes(card.unit)) return false;
  return true;
}

export function calculateRating(order: TmsOrder, card: PartnerBuyRateCard): RatingResult | null {
  if (!rateCardAppliesToOrder(order, card)) return null;
  const quantity = ratingQuantity(order, card.unit);''')

          replace_once('app/admin/rating/tms-rating.server.ts',
            '      rate_card_id: card.id,\n      rate_card_updated_at: card.updated_at || null,',
            '      rate_card_id: card.id,\n      rate_card_branch: card.branch,\n      rate_card_origin: card.origin,\n      rate_card_destination: card.destination,\n      rate_card_updated_at: card.updated_at || null,')

          # Legacy reconstruction must not use a current wrong-branch card as historical proof.
          path = 'app/admin/commercial-lineage/commercial-lineage.server.ts'
          replace_once(path,
            '  const card = rateCard.data() as Record<string, unknown>;\n  const cardPartner = normalizeCommercialId(card.partner_id);',
            '''  const card = rateCard.data() as Record<string, unknown>;
  const branch = text(data.branch);
  const mode = text(data.mode);
  if (!branch || !mode) return { kind: "commercial_review_required", reason: "legacy_order_identity_missing" };
  const cardBranch = text(card.branch);
  if (!cardBranch || (cardBranch !== "Global" && cardBranch !== branch)) return { kind: "commercial_review_required", reason: "legacy_rate_card_branch_mismatch" };
  const cardPartner = normalizeCommercialId(card.partner_id);''')
          replace_once(path,
            '  const branch = text(data.branch);\n  const mode = text(data.mode);\n  if (!branch || !mode) return { kind: "commercial_review_required", reason: "legacy_order_identity_missing" };\n  const snapshot: CommercialSnapshot = {',
            '  const snapshot: CommercialSnapshot = {')
          replace_once(path,
