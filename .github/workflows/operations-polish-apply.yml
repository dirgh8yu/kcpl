            'onKeyDown={(event) => { if (event.key === "Enter") { const href = recordResults[0]?.href ?? filteredNav[0]?.href; if (href) navigateFromPalette(href); } }} className="min-w-0 flex-1 bg-transparent text-[13px] font-medium text-[#403833] outline-none" placeholder="Search shipment, customer, enquiry or workspace…"')
          replace_once('app/admin/operations-shell.tsx',
