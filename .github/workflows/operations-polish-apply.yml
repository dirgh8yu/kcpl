            'export function AdminDashboard({ initialQuotes, initialReference }: { initialQuotes: QuoteSummary[]; initialReference?: string }) {\n  const [quotes, setQuotes] = useState(initialQuotes);\n  const preferredReference = initialReference && initialQuotes.some((quote) => quote.reference === initialReference) ? initialReference : initialQuotes[0]?.reference ?? "";\n  const [selectedReference, setSelectedReference] = useState(preferredReference);')

          replace_once('app/admin/operations-shell.tsx',
            'type StoredWorkspace = { href: string; label: string };',
            'type StoredWorkspace = { href: string; label: string };\ntype RecordSearchResult = { kind: "shipment" | "customer" | "enquiry"; id: string; title: string; subtitle: string; meta: string; href: string; searchText: string };')
          replace_once('app/admin/operations-shell.tsx',
            '  const [favorites, setFavorites] = useState<StoredWorkspace[]>([]);\n  const [recents, setRecents] = useState<StoredWorkspace[]>([]);',
            '  const [favorites, setFavorites] = useState<StoredWorkspace[]>([]);\n  const [recents, setRecents] = useState<StoredWorkspace[]>([]);\n  const [recordIndex, setRecordIndex] = useState<RecordSearchResult[]>([]);\n  const [recordIndexLoaded, setRecordIndexLoaded] = useState(false);\n  const [recordIndexLoading, setRecordIndexLoading] = useState(false);')
          replace_once('app/admin/operations-shell.tsx',
            '  const filteredNav = useMemo(() => {\n    const needle = query.trim().toLowerCase();\n    if (!needle) return allNav;\n    return allNav.filter((item) => `${item.label} ${item.hint}`.toLowerCase().includes(needle));\n  }, [allNav, query]);',
            '  const filteredNav = useMemo(() => {\n    const needle = query.trim().toLowerCase();\n    if (!needle) return allNav;\n    return allNav.filter((item) => `${item.label} ${item.hint}`.toLowerCase().includes(needle));\n  }, [allNav, query]);\n  const recordResults = useMemo(() => {\n    const needle = query.trim().toLowerCase();\n    if (needle.length < 2) return [];\n    const score = (item: RecordSearchResult) => {\n      const id = item.id.toLowerCase();\n      const title = item.title.toLowerCase();\n      const haystack = `${item.searchText} ${item.subtitle} ${item.meta}`.toLowerCase();\n      if (id === needle || title === needle) return 1000;\n      if (id.startsWith(needle) || title.startsWith(needle)) return 500;\n      if (haystack.includes(needle)) return 100;\n      return 0;\n    };\n    return recordIndex.map((item) => ({ item, score: score(item) })).filter((entry) => entry.score > 0).sort((a, b) => b.score - a.score).slice(0, 12).map((entry) => entry.item);\n  }, [query, recordIndex]);')
          anchor = '''  useEffect(() => {
    if (!paletteOpen) return;
    const frame = window.requestAnimationFrame(() => searchInputRef.current?.focus());
    return () => window.cancelAnimationFrame(frame);
  }, [paletteOpen]);'''
          insert = anchor + '''

  useEffect(() => {
    if (!paletteOpen || recordIndexLoaded || recordIndexLoading) return;
    const controller = new AbortController();
