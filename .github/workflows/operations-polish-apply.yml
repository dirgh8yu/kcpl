      })
      .finally(() => setRecordIndexLoading(false));
    return () => controller.abort();
  }, [paletteOpen, recordIndexLoaded, recordIndexLoading]);'''
          replace_once('app/admin/operations-shell.tsx', anchor, insert)
          replace_once('app/admin/operations-shell.tsx',
            '<span className="flex-1 text-left text-[10px] font-semibold">Search workspaces</span>',
