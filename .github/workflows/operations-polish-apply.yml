            '            {query.trim().length >= 2 ? <PaletteSection title="Records">{recordIndexLoading ? <div className="px-3 py-4 text-[9px] text-[#9d938b]">Loading KCPL records…</div> : recordResults.length ? recordResults.map((item) => <RecordRow key={`${item.kind}-${item.id}`} item={item} onOpen={navigateFromPalette}/>) : <div className="px-3 py-4 text-[9px] text-[#9d938b]">No shipment, customer or enquiry matches “{query}”.</div>}</PaletteSection> : null}\n            <PaletteSection title={query ? "Workspaces" : "All workspaces"}>{filteredNav.length ? filteredNav.map((item) => <PaletteRow key={item.href} item={item} onOpen={navigateFromPalette}/>) : query ? <div className="px-3 py-4 text-center text-[9px] text-[#9d938b]">No workspace matches.</div> : null}</PaletteSection>')
          replace_once('app/admin/operations-shell.tsx',
            '<span>KCPL command palette</span><span>Type to filter · Enter opens first result</span>',
            '<span>KCPL command palette</span><span>Records + workspaces · Enter opens best result</span>')
          record_helper = '''
function RecordRow({ item, onOpen }: { item: RecordSearchResult; onOpen: (href: string) => void }) {
  const icon = item.kind === "shipment" ? <Boxes size={14}/> : item.kind === "customer" ? <Building2 size={14}/> : <PackageSearch size={14}/>;
  const label = item.kind === "shipment" ? "Shipment" : item.kind === "customer" ? "Customer" : "Enquiry";
  return <button type="button" onClick={() => onOpen(item.href)} className="flex w-full items-center gap-3 rounded-[11px] px-3 py-2.5 text-left hover:bg-[#faf4ef]"><span className="grid h-8 w-8 shrink-0 place-items-center rounded-[10px] bg-[#fff0ea] text-[#c9654f]">{icon}</span><span className="min-w-0 flex-1"><span className="flex items-center gap-2"><strong className="truncate text-[10px] font-bold text-[#514840]">{item.title}</strong><small className="shrink-0 rounded-full bg-[#f2ece7] px-1.5 py-0.5 text-[7px] font-bold uppercase tracking-[.07em] text-[#8e8178]">{label}</small></span><small className="mt-0.5 block truncate text-[8px] text-[#8f857d]">{item.subtitle}</small><small className="mt-0.5 block truncate text-[7px] font-semibold text-[#aca29a]">{item.meta}</small></span><ChevronRight size={12} className="text-[#b3aaa2]"/></button>;
}
'''
          replace_once('app/admin/operations-shell.tsx', '\nfunction PaletteAction({ icon, label, hint, onClick }', record_helper + '\nfunction PaletteAction({ icon, label, hint, onClick }')

